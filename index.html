<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文獻書房</title>
<style>
/* 單機版基本重置 */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：一間書房。上方工具列與搜尋；主體是書架，每篇論文是一本書；點書進入書頁，每個欄位旁都掛著原文頁碼。 */
:root{
  --bg:#eef1ee; --surface:#fff; --surface-2:#f5f8f6; --ink:#1b2420; --muted:#5c6a63; --line:#d4dbd6;
  --accent:#1d5a48; --accent-ink:#fff; --accent-soft:#dbece4;
  --gap:#9a5b0c; --gap-soft:#faefdb; --mine:#5b3f8c; --mine-soft:#ebe4f7;
  --plank:#6b4f37; --plank-edge:#4c3725; --shelf-back:#e2e7e3;
  --sci:#2c4a6e; --nat:#6e2c38;
  --f-display:"Noto Serif TC",serif; --f-body:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --surface-2:#18201d; --ink:#e3eae6; --muted:#9aa8a1; --line:#2e3a34;
  --accent:#6cc1a2; --accent-ink:#0f1a15; --accent-soft:#1f3a30;
  --gap:#e3a54f; --gap-soft:#382b17; --mine:#b9a1e6; --mine-soft:#2b2340;
  --plank:#5a4330; --plank-edge:#3a2b1e; --shelf-back:#1a221e;
  --sci:#4a6f9e; --nat:#9e4a5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --surface-2:#18201d; --ink:#e3eae6; --muted:#9aa8a1; --line:#2e3a34;
  --accent:#6cc1a2; --accent-ink:#0f1a15; --accent-soft:#1f3a30;
  --gap:#e3a54f; --gap-soft:#382b17; --mine:#b9a1e6; --mine-soft:#2b2340;
  --plank:#5a4330; --plank-edge:#3a2b1e; --shelf-back:#1a221e;
  --sci:#4a6f9e; --nat:#9e4a5a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.68}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.38;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:11px}
.brand{display:flex;align-items:baseline;gap:9px;background:none;border:0;padding:0;color:inherit}
.brand b{font-family:var(--f-display);font-size:21px;letter-spacing:.07em}
.brand span{font-size:12px;color:var(--muted)}
.searchbox{flex:1 1 400px;min-width:0;display:flex;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
.searchbox select{border:0;background:transparent;padding:0 6px 0 11px;border-right:1px solid var(--line);color:var(--muted)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;padding:9px 11px;outline:none}
.searchbox button{border:0;background:var(--accent);color:var(--accent-ink);padding:0 15px;font-weight:500}
.ghost-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;color:var(--muted)}
.ghost-btn[aria-current="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.banner{background:var(--accent-soft);color:var(--accent);font-size:13px}
.banner .wrap{padding-block:8px}
main{padding-block:26px 70px}

.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:26px}
.intro div{padding:11px 0 11px 13px;border-left:3px solid var(--accent);font-size:13.5px;color:var(--muted)}
.intro strong{display:block;color:var(--ink);font-size:14.5px;margin-bottom:1px}

.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:16px;font-size:13.5px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;color:var(--muted);font-size:13.5px}
.seg button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}

.shelf{margin-bottom:26px}
.shelf-head{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
.shelf-head h2{font-size:17px}
.shelf-head span{font-size:13px;color:var(--muted)}
.shelf-body{background:var(--shelf-back);border-radius:4px 4px 0 0;padding:18px 16px 0;overflow-x:auto}
.books{display:flex;align-items:flex-end;gap:7px;min-height:206px}
.plank{height:13px;background:var(--plank);border-bottom:4px solid var(--plank-edge);border-radius:0 0 3px 3px}
.book{position:relative;flex:0 0 auto;width:52px;border:0;border-radius:3px 3px 1px 1px;color:#f3f0e9;padding:11px 0 9px;
 display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:7px;
 box-shadow:inset 3px 0 0 rgba(255,255,255,.13),inset -4px 0 0 rgba(0,0,0,.2);transition:transform .18s ease}
.book:hover,.book:focus-visible{transform:translateY(-9px)}
.book .t{writing-mode:vertical-rl;font-size:12.5px;line-height:1.3;max-height:148px;overflow:hidden;font-family:var(--f-body)}
.book .y{font-family:var(--f-mono);font-size:11px;opacity:.85}
.book .band{position:absolute;left:0;right:0;top:19px;height:2px;background:rgba(255,255,255,.35)}

.back{border:0;background:none;color:var(--accent);padding:0;margin-bottom:14px;font-size:14px}
.paper{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:30px;align-items:start}
@media (max-width:900px){.paper{grid-template-columns:1fr}}
.ph{padding-bottom:17px;border-bottom:1px solid var(--line);margin-bottom:22px}
.ph h1{font-size:clamp(20px,2.5vw,27px);margin:7px 0 13px}
.jtag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:4px;color:#fff}
dl.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
dl.meta dt{color:var(--muted);white-space:nowrap}
dl.meta dd{margin:0;min-width:0}
.au{display:inline-flex;gap:5px;align-items:center;margin:0 9px 4px 0;border:0;background:none;padding:0;color:inherit}
.au u{text-decoration:none;border-bottom:1px dotted var(--muted)}
.au:hover u{color:var(--accent);border-color:var(--accent)}
.role{font-size:11px;padding:0 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.role.c{background:var(--mine-soft);color:var(--mine)}
section.blk{margin-bottom:30px}
section.blk>h2{font-size:17.5px;margin-bottom:11px}
.abs{max-width:66ch;font-size:14.5px}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.kw{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 11px;font-size:13px;color:var(--muted)}
.kw:hover{border-color:var(--accent);color:var(--accent)}
.src{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;padding:1px 6px;color:var(--accent);white-space:nowrap;margin-left:6px;vertical-align:1px}
.src:hover{border-color:var(--accent);background:var(--accent-soft)}
.gap{display:inline-block;font-size:12.5px;background:var(--gap-soft);color:var(--gap);border-radius:4px;padding:1px 8px}

.exp{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:13px;overflow:hidden}
.exp-h{display:flex;flex-wrap:wrap;gap:7px 12px;align-items:baseline;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--line)}
.exp-h h3{font-size:15.5px}
.exp-h .en{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.exp-b{padding:12px 15px;display:grid;gap:11px}
.ani{display:flex;flex-wrap:wrap;gap:5px 18px;font-size:13.5px}
.ani b{font-weight:500;color:var(--muted);margin-right:4px}
table.cond{width:100%;border-collapse:collapse;font-size:13.5px}
table.cond td{border-top:1px solid var(--line);padding:6px 8px 6px 0;vertical-align:top}
table.cond td:first-child{color:var(--muted);width:36%}
.res{background:var(--surface-2);border-radius:6px;padding:9px 12px;font-size:14px}
.res b{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px;letter-spacing:.06em}

.refs{list-style:none;padding:0;margin:0;display:grid;gap:7px;font-size:14px}
.refs li{padding-left:13px;border-left:2px solid var(--line)}
.refs li.in{border-color:var(--accent)}
.tagout{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:3px;padding:0 6px;margin-left:5px;white-space:nowrap}
.tagin{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:0 6px;margin-left:5px}

aside.side{display:grid;gap:16px;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.panel h3{font-size:14.5px;margin-bottom:9px}
.note{border-left:3px solid var(--accent);padding:3px 0 3px 10px;margin-bottom:10px;font-size:13.5px}
.note.mine{border-color:var(--mine)}
.note .k{font-size:11.5px;color:var(--accent);display:block}
.note.mine .k{color:var(--mine)}
.nf{display:grid;gap:7px;margin-top:9px}
.nf textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface-2);resize:vertical;font-size:13.5px}
.nf .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.nf select,.nf input{border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--surface-2);min-width:0;font-size:13px}
.nf input{width:70px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 13px;font-weight:500;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}

.rh{margin-bottom:16px}
.rh h1{font-size:21px;margin-top:4px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:22px}
table.cmp{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
table.cmp th{text-align:left;font-weight:500;color:var(--muted);background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
table.cmp td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp tr:last-child td{border-bottom:0}
table.cmp td ul{margin:0;padding-left:16px}
mark{background:var(--gap-soft);color:inherit;padding:0 2px;border-radius:2px}
.plist{display:grid;gap:9px}
.prow{display:grid;grid-template-columns:7px minmax(0,1fr);gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px 11px 0;text-align:left;width:100%;color:inherit}
.prow .st{border-radius:0 3px 3px 0}
.prow h3{font-size:15px;margin-bottom:2px}
.prow p{margin:0;font-size:12.5px;color:var(--muted)}
.prow:hover{border-color:var(--accent)}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}

.figs{border-top:1px dashed var(--line);padding-top:10px}
.figs>b{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;margin-bottom:6px}
.fig{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:4px 10px;align-items:baseline;width:100%;text-align:left;
  border:0;border-top:1px solid var(--line);background:none;padding:7px 0;color:inherit}
.fig:first-of-type{border-top:0}
.fig:hover{background:var(--surface-2)}
.fig .fid{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);font-weight:500}
.fig .fd{font-size:13.5px;min-width:0}
.fig .fty{display:flex;gap:4px;flex-wrap:wrap}
.fig .fty i{font-style:normal;font-size:11px;border-radius:3px;padding:1px 6px;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.t-mic{background:var(--mine-soft)!important;color:var(--mine)!important;border-color:transparent!important}
.t-ephys{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:transparent!important}
.t-wb{background:var(--gap-soft)!important;color:var(--gap)!important;border-color:transparent!important}
.fig .fp{font-size:11.5px;color:var(--muted)}
@media (max-width:620px){.fig{grid-template-columns:58px minmax(0,1fr);}.fig .fty,.fig .fp{grid-column:2}}
.figfilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.figfilter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.figfilter button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.figgrp{margin-bottom:20px}
.figgrp h3{font-size:15px;margin-bottom:3px}
.figgrp>.hint{margin:0 0 8px}
.figbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 14px 10px}
.tier{border:1px solid var(--line);border-left:4px solid var(--line);background:var(--surface);border-radius:0 7px 7px 0;padding:11px 14px;margin-bottom:10px}
.tier-A{border-left-color:var(--accent)}.tier-B{border-left-color:var(--accent)}
.tier-C{border-left-color:var(--muted)}.tier-D{border-left-color:var(--mine)}
.tier-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.tier-h .lv{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted)}
.tier-D .lv{background:var(--mine-soft);color:var(--mine);border-color:var(--mine-soft)}
.tier-h b{font-size:14.5px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
.stats b{display:block;font-family:var(--f-mono);font-size:22px;line-height:1.2}
.stats span{font-size:12.5px;color:var(--muted)}
.cited{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:11px}
.cited .top{display:flex;flex-wrap:wrap;gap:7px 11px;align-items:baseline;margin-bottom:5px}
.cnt{font-family:var(--f-mono);font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 8px;white-space:nowrap}
.cited .ttl{font-size:14.5px;margin-bottom:8px}
.cited ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--muted)}
.cited ul li{margin-bottom:3px}
.verdict{border:1px solid var(--line);border-radius:8px;padding:15px 17px;background:var(--surface);margin-bottom:18px}
.verdict h3{font-size:16px;margin-bottom:7px}
.pmrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:9px}
.pmrow h3{font-size:14.5px;margin-bottom:3px}
.pmrow .j{font-size:12.5px;color:var(--muted)}
.pmrow .why{font-size:13px;margin-top:6px;padding-left:10px;border-left:2px solid var(--accent)}
.pmrow a{color:var(--accent);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.pmrow.have{border-color:var(--accent);background:var(--accent-soft)}
.gw{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto;margin-bottom:16px}
.gw svg{display:block;min-width:700px;width:100%;height:auto}
.gw text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.gw .lbl{font-family:var(--f-body);font-size:12px}
.gn{cursor:pointer}
.gn:hover circle,.gn:focus circle{stroke:var(--ink);stroke-width:2.5}

.overlay{position:fixed;inset:0;background:rgba(10,16,13,.5);z-index:20;display:flex;align-items:center;justify-content:center;
 padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:10px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:19px 21px}
.modal h2{font-size:17px;margin-bottom:5px}
.modal .pg{font-family:var(--f-mono);font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 8px;display:inline-block;margin-bottom:11px}
.modal .box{background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 13px;border-radius:0 6px 6px 0;font-size:14px;margin-bottom:11px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.book{transition:none}}
@media (max-width:640px){.brand span{display:none}.searchbox{flex-basis:100%}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="brand" type="button"><b>文獻書房</b><span>只讀你上傳的 PDF</span></button>
  <form class="searchbox" id="sf" role="search">
    <select id="scope" aria-label="搜尋範圍">
      <option value="all">全部</option><option value="exp">實驗</option><option value="cond">實驗條件</option>
      <option value="author">作者</option><option value="journal">期刊</option><option value="kw">關鍵字</option><option value="fig">圖</option>
    </select>
    <input id="q" type="search" placeholder="試試：sleep deprivation、Morris water maze、螢光、Diba" autocomplete="off">
    <button type="submit">搜尋</button>
  </form>
  <button class="ghost-btn" id="fbtn" type="button">圖目錄</button>
  <button class="ghost-btn" id="gbtn" type="button">關聯圖</button>
  <button class="ghost-btn" id="pbtn" type="button">PubMed</button>
</div></header>
<div class="banner"><div class="wrap">書架上的 2 本書，是從你給的兩個 PDF 讀出來的。每個欄位後面的頁碼，就是它在原文的位置。</div></div>

<main class="wrap" id="app"></main>
<div class="overlay" id="ov" hidden><div class="modal" id="md" role="dialog" aria-modal="true"></div></div>

<script>
const J={sci:{n:"Science",c:"var(--sci)"},nat:{n:"Nature",c:"var(--nat)"}};
const P=[
{id:"a",j:"sci",color:"var(--sci)",
 title:"REM sleep-active MCH neurons are involved in forgetting hippocampus-dependent memories",
 zh:"REM 睡眠期活化的 MCH 神經元參與海馬迴依賴記憶的遺忘",
 journal:"Science",cite:"365(6459):1308–1313",year:2019,date:"2019-09-20",doi:"10.1126/science.aax9238",jp:1,
 species:"小鼠",topic:"睡眠期的主動遺忘",

 affil:"名古屋大學環境醫學研究所、北海道大學、東海大學、SRI International",

function matches(p,q,scope){
  const hit=[];
  const add=(where,text,page)=>{if(text&&String(text).toLowerCase().includes(q))hit.push({where,text,page})};
  if(scope==="all"||scope==="exp")p.exps.forEach(e=>{if((e.n+" "+e.en).toLowerCase().includes(q))hit.push({where:"實驗",text:e.n,page:e.p,exp:e})});
  if(scope==="all"||scope==="cond")p.exps.forEach(e=>e.cond.forEach(([k,v])=>{if((k+" "+v).toLowerCase().includes(q))hit.push({where:"條件",text:k+"："+v,page:e.p,exp:e})}));
  if(scope==="all"||scope==="author"){p.authors.forEach(a=>add("作者",a[0],p.ap));p.topCited.forEach(r=>add("參考文獻",r.t,null))}
  if(scope==="all"||scope==="journal")add("期刊",p.journal+" "+p.cite,p.jp);
  if(scope==="all"||scope==="kw")p.kws.forEach(k=>add("關鍵字",k,1));
  if(scope==="all"||scope==="fig")figsOf(p.id).forEach(f=>{
    const hay=(f.id+" Fig."+f.id+" "+f.d+" "+f.ex+" "+f.ty.map(t=>FT[t]).join(" ")).toLowerCase();
    const nm=s=>s.replace(/[.\s]/g,"");
    if(hay.includes(q)||nm(hay).includes(nm(q))){const e=p.exps.find(x=>x.n===f.ex);hit.push({where:"圖",text:"Fig. "+f.id+"："+f.d,page:f.p,exp:e})}});
  if(scope==="all"){add("標題",p.title,1);add("摘要",p.abs,1);add("討論",p.disc,p.dp)}
  return hit;
}

  <p class="hint" style="margin:0 0 7px">查詢：<span class="mono">"melanin-concentrating hormone" AND hippocampus AND memory</span></p>
  <p class="hint" style="margin:0 0 11px">PubMed 把它翻譯成：<span class="mono" style="font-size:11.5px">"melanin-concentrating hormone"[All Fields] AND ("hippocampus"[MeSH Terms] OR "hippocampus"[All Fields]) AND ("memories"[All Fields] OR "memory"[MeSH Terms] OR ...)</span>　共 <b>27 筆</b>，以下是相關度排序前 5。</p>
  ${[
    {p:"42707409",t:"Tracing melanin-concentrating hormone function: decades of memory research and emerging links to Alzheimer's disease.",j:"Niño-Rivero S, Blanco E, Rodríguez-Canclini V, … Galeano P · Front Neurosci 20:1918594 · 2026 · doi:10.3389/fnins.2026.1918594",
     w:"綜述，主題同時命中 MCH、記憶、海馬迴三個詞。這是 5 筆裡最值得你去看的 —— 它會把這條線的歷史整理好。<b>不在你的書庫裡。</b>"},
    {p:"34980924",t:"Hypothalamic melanin-concentrating hormone regulates hippocampus-dorsolateral septum activity.",j:"Liu JJ, Tsien RW, Pang ZP · Nat Neurosci 25:61-71 · 2022 Jan · doi:10.1038/s41593-021-00984-5",
     w:"命中 MCH + 海馬迴。主題是 MCH 對海馬－外側隔區迴路的調節，和你那篇講的「MCH 末梢經 GABA 中間神經元抑制 CA1」是同一條機制線。<b>不在你的書庫裡。</b>"},
    {p:"36565982",t:"Acute intrahippocampal administration of melanin-concentrating hormone impairs memory consolidation and decreases the expression of MCHR-1 and TrkB receptors.",j:"Ruiz-Viroga V, de Ceglia M, Morelli L, … Lagos P · Prog Neuropsychopharmacol Biol Psychiatry 123:110703 · 2023 Apr 20 · doi:10.1016/j.pnpbp.2022.110703",
     w:"三個詞全中。直接把 MCH 打進海馬迴會損害記憶鞏固 —— 和你那篇用光遺傳得到的結論方向一致，但手法不同。<b>不在你的書庫裡。</b>"},
    {p:"31183806",t:"Nasal Cavity Administration of Melanin-Concentrating Hormone Improves Memory Impairment in Memory-Impaired and Alzheimer's Disease Mouse Models.",j:"Oh ST, Liu QF, Jeong HJ, … Jeon S · Mol Neurobiol 56:8076-8086 · 2019 Dec · doi:10.1007/s12035-019-01662-1",
     w:"命中三個詞，但結論方向相反（給 MCH 反而改善記憶）。<b>這種相反的結果系統不會幫你藏起來</b>，也不會幫你解釋，留給你自己判斷。<b>不在你的書庫裡。</b>"},
    {p:"39119926",t:"Central Role of Hypothalamic Circuits for Acupuncture's Anti-Parkinsonian Effects.",j:"Oh JY, Lee H, Jang SY, … Park HJ · Adv Sci (Weinh) 11:e2403245 · 2024 Nov · doi:10.1002/advs.202403245",
     w:"主題是針灸與帕金森氏症，和你要找的沒什麼關係。<b>這筆我照樣列出來</b>，因為它確實出現在 PubMed 相關度排序的前 5 名 —— 把雜訊藏起來，你就不知道這個查詢其實不夠準。"}
  ].map(r=>`<div class="pmrow"><div><h3>${esc(r.t)}</h3><p class="j">${esc(r.j)}</p>
    <p class="why"><b>為什麼找到它：</b>${r.w}</p></div>
    <a href="https://pubmed.ncbi.nlm.nih.gov/${r.p}/" target="_blank" rel="noopener">PMID ${r.p} ↗</a></div>`).join("")}
  <p class="hint">注意一件事：這 5 筆裡<b>沒有你書庫裡那篇</b>。PubMed 的相關度排序跟你的書庫沒有關係，它不知道你讀過什麼。</p>

  <h2 style="font-size:17px;margin:22px 0 4px">實測三：查到的剛好已經在書架上</h2>
  <p class="hint" style="margin:0 0 11px">查詢：<span class="mono">Izawa S[au] AND melanin-concentrating AND forgetting</span>　共 1 筆。</p>
  <div class="pmrow have"><div><h3>REM sleep-active MCH neurons are involved in forgetting hippocampus-dependent memories.</h3>
    <p class="j">Science · 2019 · PMID 31604241</p>
    <p class="why"><b>這本你已經有了。</b>系統比對 DOI 和 PMID 之後認出來，所以不會叫你再下載一次，直接給你書架上的連結。</p>
    <p style="margin-top:8px"><button class="btn" data-open="a" type="button">翻到這本書 →</button></p></div>
    <a href="https://pubmed.ncbi.nlm.nih.gov/31604241/" target="_blank" rel="noopener">PMID 31604241 ↗</a></div>

  <h2 style="font-size:17px;margin:22px 0 4px">實測四：同一份研究有兩筆紀錄</h2>
  <p class="hint" style="margin:0 0 11px">查詢：<span class="mono">"Sleep loss diminishes hippocampal reactivation and replay"</span>　共 <b>2 筆</b>。</p>
  <div class="pmrow have"><div><h3>Sleep loss diminishes hippocampal reactivation and replay.</h3>
    <p class="j">Nature 630:935-942 · 2024 Jun · doi:10.1038/s41586-024-07538-2 · 正式版</p>
    <p class="why"><b>這本你已經有了</b>，就是書架上那本 Nature 2024。</p></div>
    <a href="https://pubmed.ncbi.nlm.nih.gov/38867049/" target="_blank" rel="noopener">PMID 38867049 ↗</a></div>
  <div class="pmrow"><div><h3>Sleep loss diminishes hippocampal reactivation and replay.</h3>
    <p class="j">Res Sq · 2023 Feb 16 · doi:10.21203/rs.3.rs-2540186/v1 · <b>Preprint（預印本）</b></p>
    <p class="why"><b>為什麼找到它：</b>標題一模一樣。PubMed 的 pubtype 標成 Preprint，所以系統判定這是同一份研究的預印本，會把它掛在那本書底下、標成「預印本版本」，而<b>不會另外開一本新書</b>。<br>
    這點很重要：預印本和正式版的數字常常不一樣（審稿後補實驗、改分析）。如果你引用到預印本的數字，審稿人會抓出來。所以系統只提醒你有這個版本存在，不會把兩邊的數據混在一起。</p></div>
    <a href="https://pubmed.ncbi.nlm.nih.gov/36824950/" target="_blank" rel="noopener">PMID 36824950 ↗</a></div>

  <div class="verdict" style="margin-top:22px"><h3>PubMed 給得了什麼、給不了什麼</h3>
    <table class="cmp" style="min-width:0"><tbody>
      <tr><td style="width:46%">標題、作者、期刊、年份、DOI</td><td><span class="tagin">給得了</span></td></tr>
      <tr><td>摘要全文</td><td><span class="tagin">給得了</span></td></tr>
      <tr><td>MeSH 標引詞（人工標的主題詞）</td><td><span class="tagin">給得了</span></td></tr>
      <tr><td>有沒有預印本版本、有沒有被撤稿</td><td><span class="tagin">給得了</span></td></tr>
      <tr><td>這篇做了哪些實驗、n 是多少、鼠齡多少</td><td><span class="gap">給不了</span></td></tr>
      <tr><td>實驗條件、統計數字、圖表</td><td><span class="gap">給不了</span></td></tr>
      <tr><td>它引用了哪些論文</td><td><span class="gap">PubMed 本身沒有</span></td></tr>
    </tbody></table>
    <p style="margin:11px 0 0;font-size:14px">所以 PubMed 的角色很清楚：<b>它是用來「找到」和「核對」的，不是用來「讀」的。</b>書架上那些能點進去看條件的書，永遠只能來自你自己丟上來的 PDF。</p>
  </div>`;
}

function renderGraph(){
  app.innerHTML=`<button class="back" data-back>← 回書架</button>
  <div class="rh"><span class="hint">只畫書庫內查得到的連結</span><h1>引用關聯圖</h1></div>
  <div class="gw"><svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="兩篇論文的關聯圖">
    <line x1="170" y1="110" x2="530" y2="110" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"></line>
    <text x="350" y="100" text-anchor="middle" fill="var(--muted)" class="lbl">沒有互相引用</text>
    <path d="M170 130 Q350 225 530 130" fill="none" stroke="var(--accent)" stroke-width="2"></path>
    <text x="350" y="240" text-anchor="middle" fill="var(--accent)" class="lbl">作者關聯：Diba K</text>
    <text x="350" y="258" text-anchor="middle" fill="var(--muted)" class="lbl">是左邊參考文獻 #31 的共同作者，也是右邊的通訊作者</text>
    <g class="gn" data-open="a" tabindex="0"><circle cx="170" cy="110" r="46" fill="var(--sci)"></circle>
      <text x="170" y="106" text-anchor="middle" fill="#fff">Science</text>
      <text x="170" y="122" text-anchor="middle" fill="#fff">2019</text>
      <text x="170" y="178" text-anchor="middle" class="lbl" fill="var(--ink)">MCH 神經元與遺忘</text></g>
    <g class="gn" data-open="b" tabindex="0"><circle cx="530" cy="110" r="46" fill="var(--nat)"></circle>
      <text x="530" y="106" text-anchor="middle" fill="#fff">Nature</text>
      <text x="530" y="122" text-anchor="middle" fill="#fff">2024</text>
      <text x="530" y="178" text-anchor="middle" class="lbl" fill="var(--ink)">睡眠不足與重播</text></g>
    <text x="350" y="40" text-anchor="middle" class="lbl" fill="var(--muted)">書庫裡只有 2 本書，所以圖上只有 2 個點</text>
  </svg></div>
  <div class="panel"><h3>這張圖為什麼這麼空</h3>
  <p style="margin:0 0 9px;font-size:14px">因為它只畫查得到的東西。兩篇的參考文獻（31 條與 76 條）都不在你的書庫裡，所以系統不會替它們畫點 — 那些只是書目字串，不是你讀過、能點進去看條件的論文。</p>
  <p style="margin:0 0 11px;font-size:14px">等你再丟十幾篇進來，共同引用的那幾篇會自己變成書，線也會自己連起來。在那之前，空就是空。</p>
  <p style="margin:0"><button class="btn" data-refs="a" type="button">看共同引用是怎麼比對的 →</button></p></div>`;
}

function render(){
  if(view.t==="shelf")renderShelf();
  else if(view.t==="paper")renderPaper(view.id);
  else if(view.t==="search")renderSearch(view.q,view.scope);
  else if(view.t==="refs")renderRefs(view.id);
  else if(view.t==="figs")renderFigs(view.ty);
  else if(view.t==="pubmed")renderPubmed();
  else renderGraph();
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-by]");if(b){view.by=b.dataset.by;render();return}
  const fg=e.target.closest("[data-fig]");if(fg){showFig(fg.dataset.fig);return}
  const ft=e.target.closest("[data-ty]");if(ft){view={t:"figs",ty:ft.dataset.ty,by:view.by};render();return}
  const rf=e.target.closest("[data-refs]");if(rf){view={t:"refs",id:rf.dataset.refs,by:view.by};render();return}
  const o=e.target.closest("[data-open]");if(o){view={t:"paper",id:o.dataset.open,by:view.by};render();return}
  if(e.target.closest("[data-back]")){view={t:"shelf",by:view.by};render();return}
  const au=e.target.closest("[data-au]");if(au){$("#scope").value="author";$("#q").value=au.dataset.au;view={t:"search",q:au.dataset.au,scope:"author",by:view.by};render();return}
  const kw=e.target.closest("[data-kw]");if(kw){$("#scope").value="kw";$("#q").value=kw.dataset.kw;view={t:"search",q:kw.dataset.kw,scope:"kw",by:view.by};render();return}
  const s=e.target.closest("[data-src]");if(s){showSrc(s.dataset.src);return}
  if(e.target.closest("#ov")&&!e.target.closest("#md"))$("#ov").hidden=true;
  if(e.target.closest("[data-close]"))$("#ov").hidden=true;
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")$("#ov").hidden=true;
  const g=e.target.closest&&e.target.closest(".gn");
  if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();view={t:"paper",id:g.dataset.open,by:view.by};render()}
});
function showFig(d){
  const [pid,fid]=d.split(":");const f=FIGS.find(x=>x.pid===pid&&x.id===fid);const p=P.find(x=>x.id===pid);
  const e=p.exps.find(x=>x.n===f.ex);
  $("#md").innerHTML=`<h2>Fig. ${esc(f.id)}</h2>
  <span class="pg">${esc(p.journal)} ${p.year} · 圖說在原文第 ${f.p} 頁</span>
  <div class="box">${esc(f.d)}</div>
  <p style="font-size:14px;margin:0 0 4px"><b>圖的類型</b>（系統從圖說判讀）</p>
  <div class="fty" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${f.ty.map(t=>`<i class="t-${t}" style="font-style:normal;font-size:12px;border-radius:3px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)">${FT[t]}</i>`).join("")}</div>
  <p style="font-size:14px;margin:0 0 4px"><b>屬於哪個實驗</b></p>
  <p style="font-size:14px;margin:0 0 12px">${esc(f.ex)}${e?`　<span class="hint">${esc(e.en)}</span>`:""}</p>
  ${e?`<p style="font-size:14px;margin:0 0 4px"><b>這個實驗的條件</b></p>
  <table class="cond" style="margin-bottom:12px"><tbody>${e.cond.slice(0,4).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${gap(v)}</td></tr>`).join("")}</tbody></table>`:""}
  <p class="hint">示範版只到這裡：圖號、頁碼、類型、對應的實驗和條件。<b>正式版會把 PDF 第 ${f.p} 頁的這個面板裁出來顯示在這裡</b>，你不用開 PDF 就能看到那張螢光圖或那條 band 長什麼樣，旁邊就是條件表。</p>
  <div class="actions"><button class="btn g" data-close type="button">關閉</button>
    <button class="btn" data-open="${pid}" type="button">翻到這本書</button></div>`;
  $("#ov").hidden=false;
}
function showSrc(d){
  const [id,p,label]=d.split(":");const paper=P.find(x=>x.id===id);
  $("#md").innerHTML=`<h2>${esc(label||"這筆資料")}</h2>
  <span class="pg">${esc(paper.journal)} ${paper.year} · 原文第 ${p} 頁</span>
  <div class="box">系統是從這份 PDF 的第 ${p} 頁讀到這筆資料的。沒有改寫數字，也沒有從別的地方補。</div>
  <p class="hint">示範版只標到頁碼。正式版會直接把 PDF 翻到這一頁、把對應的那幾行反白起來，讓你一秒確認系統有沒有讀錯 — 因為擷取一定會有讀錯的時候，你要能馬上抓到。</p>
  <div class="actions"><button class="btn g" data-close type="button">知道了</button></div>`;
  $("#ov").hidden=false;
}
$("#sf").addEventListener("submit",e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;view={t:"search",q,scope:$("#scope").value,by:view.by};render()});
$("#gbtn").addEventListener("click",()=>{view={t:"graph",by:view.by};render()});
$("#pbtn").addEventListener("click",()=>{view={t:"pubmed",by:view.by};render()});
$("#fbtn").addEventListener("click",()=>{view={t:"figs",ty:"",by:view.by};render()});
$("#brand").addEventListener("click",()=>{view={t:"shelf",by:view.by};render()});
render();
</script>
